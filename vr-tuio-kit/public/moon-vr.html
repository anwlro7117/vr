<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>달 청소부</title>
<style>
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11-Bold.woff2) format('woff2');font-display:block}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0b0b1e;font-family:Galmuri,"Malgun Gothic",sans-serif}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#menu{position:fixed;display:none;flex-direction:column;align-items:center;gap:2.4vh;padding-top:5vh;z-index:3;
  background:#14143a;background-image:radial-gradient(#ffffff22 1px,transparent 1px);background-size:4vh 4vh}
#menu.on{display:flex}
#menu h1{font-size:9vh;color:#ffe066;text-shadow:.6vh .6vh 0 #8a3c00,1.2vh 1.2vh 0 #00000088;letter-spacing:.3vh;text-align:center;line-height:1.15}
#menu h1 small{display:block;font-size:2.8vh;color:#cfd6ff;text-shadow:.3vh .3vh 0 #000;margin-top:1.4vh;letter-spacing:0}
.row{display:flex;gap:1.6vh;align-items:center}
.lbl{font-size:2.8vh;color:#9fb0ff;min-width:9vh;text-align:right;white-space:nowrap}
.opt{font-size:3vh;padding:1.4vh 3vh;background:#2b2b6b;color:#e8ebff;white-space:nowrap;box-shadow:.6vh .6vh 0 #000;border:.4vh solid #6c6cd8}
.opt.sel{background:#ffe066;color:#3a2100;border-color:#fff7c2}
.opt small{display:block;font-size:1.8vh;opacity:.85}
#startBtn{font-size:5.4vh;padding:2vh 10vh;background:#ff7b29;color:#fff;box-shadow:1vh 1vh 0 #000;border:.6vh solid #ffd0a8;margin-top:1vh;text-shadow:.4vh .4vh 0 #8a3c00}
#homeBtn{position:fixed;width:7vh;height:7vh;background:#ffffffdd;font-size:3.4vh;display:none;z-index:4;box-shadow:.5vh .5vh 0 #000}
#homeBtn.on{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<section id="menu">
  <h1>🌕 달 청소부 🧹<small>달이 먼지투성이! 손으로 싹싹 문질러 닦아요</small></h1>
  <div class="row"><span class="lbl">놀이</span>
    <button class="opt" data-k="mode" data-v="coop">🤝 다 같이<small>세 벽 · 3단계</small></button>
    <button class="opt" data-k="mode" data-v="vs">⚔️ 왼쪽 vs 오른쪽<small>먼저 닦는 팀 승리</small></button>
  </div>
  <div class="row"><span class="lbl">먼지</span>
    <button class="opt" data-k="lv" data-v="0">🌫 얇게</button>
    <button class="opt" data-k="lv" data-v="1">🌫🌫 보통</button>
    <button class="opt" data-k="lv" data-v="2">🌫🌫🌫 두껍게</button>
  </div>
  <button id="startBtn">청소 시작! ▶</button>
</section>
<button id="homeBtn">🏠</button>
<script>window.TUIO_DWELL_MS=5000;</script>
<script>
// ======================================================================
// 달 청소부 — VR실 벽 3면 (launch.js span moon-vr.html)
//  벽마다 숨은 그림이 먼지에 덮여 있다. 손으로 문지르면 닦인다. (Moon Sweepers 착안)
//  도트(픽셀) 그림: 벽 하나 = 160x90 칸을 크게 늘려 그림. 그림은 전부 코드로 그림.
//  1단계 칫솔 → 2단계 빗자루 + 먼지 괴물 → 3단계 청소기 + 로봇 도우미
//  센서 약한 곳 대비: 벽 가운데 띠는 먼지가 얇고, 90% 닦으면 나머지는 저절로 사라짐.
//  아래 20%(센서 약함)는 땅·점수 띠라 닦을 필요 없음.  Esc 처음으로
// ======================================================================
const $=s=>document.querySelector(s);
const LS='moonvr.';
function load(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
const CFG={mode:load('mode','coop'),lv:load('lv',1)};
const WALLS=['left','front','right'];
const LW=160,LH=90,DH=72;            // 낮은 해상도 / 먼지 덮인 줄 수 (아래 18줄은 땅)
const FONT='Galmuri,"Malgun Gothic",sans-serif';

// ---------------- 소리 ----------------
let AC=null,scrubG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(AC){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.8;
    scrubG=AC.createGain();scrubG.gain.value=0;s.connect(f);f.connect(scrubG);scrubG.connect(AC.destination);s.start()}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type='square',v=.08){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,T);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+d+.02)}
const sfx={
  ding(){[1319,1760].forEach((f,i)=>tone(f,i*.07,.15,'square',.05))},
  pop(){tone(300,0,.08,'square',.1);tone(900,.04,.12,'square',.07)},
  hit(){tone(180,0,.06,'square',.08)},
  wall(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.22,'square',.07))},
  stage(){[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.12,.3,'square',.07));[196,262,330].forEach((f,i)=>tone(f,i*.36,.4,'triangle',.12))},
  click(){tone(880,0,.05,'square',.06)},
};
let scrubAct=0;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}

// ---------------- 도트 그리기 도구 (낮은 해상도 캔버스 g 위) ----------------
let g=null;
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function E(cx,cy,rx,ry,c,top){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let dy=-ry;dy<=(top?0:ry);dy++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry+.01))));g.fillRect(cx-w,cy+dy,w*2+1,1)}}
function C(cx,cy,r,c,top){E(cx,cy,r,r,c,top)}
function SP(map,pal,x,y,flip){for(let j=0;j<map.length;j++){const row=map[j];for(let i=0;i<row.length;i++){const ch=row[flip?row.length-1-i:i];if(ch==='.')continue;g.fillStyle=pal[ch];g.fillRect(Math.round(x)+i,Math.round(y)+j,1,1)}}}
function T(s,x,y,c){} // (글자는 큰 화면에서 그림)

// ---------------- 도트 스프라이트 ----------------
const TOOLS=[
  {name:'칫솔',r:3.6,map:[
    "...........WWWW",
    "...........WWWW",
    "BBBBBBBBBBBBBBB",
    ".BBBBBBBBBBBBBB"],pal:{B:'#3fa9ff',W:'#ffffff'}},
  {name:'빗자루',r:5.6,map:[
    "....H....",
    "....H....",
    "....H....",
    "....H....",
    "....H....",
    "...RRR...",
    "..YYYYY..",
    ".YYYYYYY.",
    "YYYYYYYYY",
    "Y.Y.Y.Y.Y"],pal:{H:'#8d5a2b',R:'#e53935',Y:'#ffd54f'}},
  {name:'청소기',r:7.6,map:[
    "......GG....",
    ".....G..G...",
    "....G....G..",
    "...G.....G..",
    "RRRRRR...G..",
    "RWWRRRR..G..",
    "RRRRRRRRGGG.",
    ".KK....KDDDD"],pal:{R:'#e53935',W:'#ffffff',G:'#9e9e9e',K:'#212121',D:'#616161'}},
];
const MONSTER={map:[
  "..G.G.G..",
  ".GGGGGGG.",
  "GGWWGWWGG",
  "GGWKGWKGG",
  "GGGGGGGGG",
  "GGGKKKGGG",
  ".GGGGGGG.",
  "..G...G.."],pal:{G:'#5d5c6a',W:'#ffffff',K:'#111111'}};
const ROBOT={map:[
  "...KKKK...",
  ".KSSSSSSK.",
  "KSSBSSBSSK",
  "KSSSSSSSSK",
  ".KSSSSSSK.",
  "..KKKKKK.."],pal:{K:'#263238',S:'#cfd8dc',B:'#00e5ff'}};

// ---------------- 숨은 그림 6가지 (a = 다 닦은 뒤 움직임 0→) ----------------
function ground(){ // 땅 (아래 18줄)
  R(0,DH,LW,LH-DH,'#8e8a9e');R(0,DH,LW,1,'#b9b5c8');
  for(const [x,w] of [[14,10],[52,7],[96,12],[138,8]]){E(x,DH+8,w,2,'#77738a');E(x,DH+7,w-2,1,'#6a667d')}
}
const SCENES=[
 {name:'달토끼 떡방아',draw(t,a){
    const cx=80,gy=DH;
    // 절구
    R(cx-9,gy-12,18,12,'#8d5a2b');R(cx-11,gy-14,22,3,'#a1693a');R(cx-7,gy-12,14,2,'#f5f5f5');
    for(const s of [-1,1]){
      const x=cx+s*26,up=a>0?Math.abs(Math.sin(t*6+(s>0?Math.PI/2:0))):(Math.sin(t*1.5)+1)*.15;
      E(x,gy-10,9,8,'#ffffff');C(x-s*5,gy-21,6,'#ffffff');
      R(x-s*7-1,gy-36,3,11,'#ffffff');R(x-s*3-1,gy-37,3,12,'#ffffff');R(x-s*7,gy-34,1,7,'#ffb3c6');R(x-s*3,gy-35,1,8,'#ffb3c6');
      R(x-s*8,gy-22,2,2,'#222');R(x-s*10,gy-19,2,1,'#ffb3c6');
      // 절굿공이
      const py=gy-30+up*10;R(x-s*13-1,py,3,16,'#a1693a');R(x-s*13-4,py+14,9,4,'#8d5a2b');
    }
    if(a>0)for(let i=0;i<5;i++){const k=(t*2+i*.2)%1;R(cx-12+i*6,gy-16-k*14,2,2,`rgba(255,255,255,${1-k})`)}
 }},
 {name:'로켓 발사',draw(t,a){
    const cx=80,lift=a>0?Math.min(70,Math.pow(Math.max(0,a-1),2)*18):0,by=DH-6-lift;
    // 발사대
    R(cx-22,DH-4,44,4,'#616161');R(cx+16,DH-50,3,46,'#9e9e9e');for(let y=DH-48;y<DH-4;y+=6)R(cx+12,y,7,1,'#9e9e9e');
    // 불꽃
    if(a>0){for(let i=0;i<10;i++){const k=Math.random();R(cx-5+Math.random()*10,by+2+k*14,2+Math.random()*2,2,k<.4?'#fff59d':k<.7?'#ffb300':'#ff5722')}}
    // 몸통
    R(cx-7,by-38,14,36,'#eceff1');R(cx-7,by-38,3,36,'#cfd8dc');
    for(let i=0;i<8;i++)R(cx-7+i,by-38-i,14-i*2,1,'#e53935');
    C(cx,by-26,4,'#1565c0');C(cx-1,by-27,2,'#64b5f6');
    R(cx-12,by-12,5,10,'#e53935');R(cx+7,by-12,5,10,'#e53935');R(cx-2,by-12,4,10,'#c62828');
    R(cx-7,by-2,14,3,'#424242');
 }},
 {name:'외계인 우주선',draw(t,a){
    const cx=80,cy=30+Math.sin(t*2)*2;
    if(a>0){g.fillStyle='rgba(255,241,118,.35)';for(let y=cy+5;y<DH;y++){const w=8+(y-cy)*.6;g.fillRect(cx-w,y,w*2,1)}
      const ay=DH-10-Math.min(1,a)*20;C(cx,ay,3,'#7cb342');R(cx-1,ay-1,1,1,'#000');R(cx+1,ay-1,1,1,'#000')}
    E(cx,cy-5,10,8,'#b2ebf2',true);C(cx,cy-6,4,'#7cb342');R(cx-2,cy-7,1,2,'#000');R(cx+2,cy-7,1,2,'#000');R(cx-3,cy-12,1,3,'#7cb342');R(cx+3,cy-12,1,3,'#7cb342');
    E(cx,cy,24,5,'#90a4ae');E(cx,cy-1,24,2,'#b0bec5');
    for(let i=0;i<7;i++){const on=(Math.floor(t*4)+i)%3===0;R(cx-18+i*6,cy+1,2,2,on?['#ff5252','#ffeb3b','#69f0ae'][i%3]:'#546e7a')}
 }},
 {name:'달 기지',draw(t,a){
    for(const [x,r] of [[48,14],[86,18],[120,11]]){C(x,DH,r,'#e0e0e0',true);C(x,DH,r-3,'#bdbdbd',true);for(let i=-r+4;i<r-3;i+=5)R(x+i,DH-Math.sqrt(Math.max(0,(r-3)**2-i*i))+2,2,2,a>0&&Math.floor(t*3+i)%2?'#ffeb3b':'#78909c')}
    R(86,DH-40,1,22,'#9e9e9e');C(86,DH-42,3,'#cfd8dc');if(a>0&&Math.floor(t*2)%2)R(85,DH-46,3,2,'#ff5252');
    R(130,DH-30,1,30,'#bdbdbd');const c=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa'];for(let i=0;i<6;i++)R(131,DH-30+i*2,12+(a>0?Math.round(Math.sin(t*5+i)):0),2,c[i]);
    for(let i=0;i<3;i++){const x=(20+t*12*(a>0?1:0)+i*14)%60;R(x,DH-5,6,3,'#ffca28');R(x+1,DH-2,1,2,'#333');R(x+4,DH-2,1,2,'#333')}
 }},
 {name:'우주 고래',draw(t,a){
    const cx=78+Math.sin(t*.8)*(a>0?20:3),cy=36+Math.sin(t*1.6)*3;
    E(cx,cy,30,13,'#1e88e5');E(cx,cy+5,26,7,'#90caf9');
    for(let i=0;i<6;i++)R(cx-16+i*6,cy+4,4,1,'#64b5f6');
    const tw=Math.round(Math.sin(t*3)*3);R(cx+28,cy-2+tw,6,4,'#1e88e5');R(cx+32,cy-8+tw,5,6,'#1e88e5');R(cx+32,cy+2+tw,5,6,'#1e88e5');
    C(cx-18,cy-3,2,'#fff');R(cx-18,cy-3,1,1,'#000');R(cx-24,cy+3,5,1,'#0d47a1');
    if(a>0)for(let i=0;i<8;i++){const k=(t*1.5+i/8)%1;R(cx-8+Math.sin(i)*k*10,cy-14-k*16,2,2,`rgba(179,229,252,${1-k})`)}
    for(let i=0;i<4;i++){const s=((t*.5+i*.25)%1);R(20+i*35,10+s*50,1,1,'#fff59d')}
 }},
 {name:'무지개 우주인',draw(t,a){
    const cx=72,gy=DH;
    R(cx-6,gy-22,12,16,'#eceff1');R(cx-9,gy-20,3,10,'#b0bec5');R(cx-5,gy-6,4,6,'#eceff1');R(cx+1,gy-6,4,6,'#eceff1');R(cx-5,gy-1,4,1,'#757575');R(cx+1,gy-1,4,1,'#757575');
    C(cx,gy-29,7,'#eceff1');E(cx+1,gy-29,5,4,'#263238');R(cx+3,gy-31,2,1,'#80deea');
    const wave=a>0?Math.round(Math.sin(t*8)*3):0;R(cx+6,gy-20,6,3,'#eceff1');R(cx+10,gy-27+wave,3,8,'#eceff1');
    R(cx-14,gy-22,2,6,'#eceff1');
    R(cx+22,gy-44,1,44,'#bdbdbd');const c=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#3949ab','#8e24aa'];
    for(let i=0;i<7;i++)R(cx+23,gy-44+i*2,18+(a>0?Math.round(Math.sin(t*5+i*.6)*2):0),2,c[i]);
    for(let i=0;i<4;i++)R(cx-30+i*4,gy-1,2,1,'#6a667d');
 }},
];

// ---------------- 벽 상태 ----------------
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,RECT={};
function viewportOrigin(){const bx=Math.max(0,(outerWidth-innerWidth)/2);return{x:screenX+bx,y:screenY+Math.max(0,outerHeight-innerHeight-bx)}}
function computeRects(){
  const walls=load('walls',null),r={};
  if(walls&&walls.left&&walls.front&&walls.right){const o=viewportOrigin();
    for(const k of WALLS){const s=walls[k];let x0=s.x-o.x,y0=s.y-o.y,x1=x0+s.w,y1=y0+s.h;x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(W,x1);y1=Math.min(H,y1);
      r[k]=x1-x0>50&&y1-y0>50?{x:x0,y:y0,w:x1-x0,h:y1-y0}:null}
    if(r.left&&r.front&&r.right)return r}
  const w=W/3;WALLS.forEach((k,i)=>r[k]={x:Math.round(i*w),y:0,w:Math.round(w),h:H});return r}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const WL={};  // 벽별 상태
for(const k of WALLS){
  const comp=mk(LW,LH),dc=mk(LW,LH);
  const stars=[];for(let i=0;i<70;i++)stars.push([Math.random()*LW|0,Math.random()*(DH-4)|0,Math.random()]);
  WL[k]={k,comp,cg:comp.getContext('2d'),dc,dg:dc.getContext('2d'),img:null,dust:new Float32Array(LW*DH),init:0,shade:new Uint8Array(LW*DH),stars,
    scene:0,done:false,doneT:0,frac:0,active:true,mons:[],robot:null,parts:[],cursors:new Map(),lastDing:0,team:null};
}
function makeShade(w){ // 먼지 무늬 + 분화구
  const cr=[];for(let i=0;i<9;i++)cr.push([Math.random()*LW,Math.random()*DH,3+Math.random()*9]);
  // 덩어리 무늬 (값 노이즈)
  const GS=9,gw=Math.ceil(LW/GS)+2,gh=Math.ceil(DH/GS)+2,gr=[];for(let i=0;i<gw*gh;i++)gr.push(Math.random());
  const vn=(x,y)=>{const gx=x/GS,gy=y/GS,ix=gx|0,iy=gy|0,fx=gx-ix,fy=gy-iy,q=(i,j)=>gr[((iy+j)%gh)*gw+((ix+i)%gw)];return (q(0,0)*(1-fx)+q(1,0)*fx)*(1-fy)+(q(0,1)*(1-fx)+q(1,1)*fx)*fy};
  for(let y=0;y<DH;y++)for(let x=0;x<LW;x++){
    const n=vn(x,y)*.8+vn(x*2.3+40,y*2.3)*.35+Math.random()*.18;
    let s=n>.9?3:n>.62?2:n>.4?1:0;
    for(const [cx,cy,r] of cr){const d=Math.hypot(x-cx,y-cy);if(d<r){s=d>r-1.5?3:d<r*.6?1:0;if(d<r*.6&&x<cx&&y<cy)s=0}}
    w.shade[y*LW+x]=s}
}
const DUSTC=[[104,102,120],[124,122,140],[146,144,160],[172,170,186]];
const THICK=[.75,1.1,1.6];
function fillDust(w){
  const t=THICK[CFG.lv];let s=0;
  for(let y=0;y<DH;y++)for(let x=0;x<LW;x++){
    const mid=Math.abs(x/LW-.5)<.12?.55:1;            // 벽 가운데 띠: 센서 약함 → 얇게
    const low=y>DH-10?.6:1;                             // 아래쪽도 약함
    const v=t*mid*low*(.85+Math.random()*.3);w.dust[y*LW+x]=v;s+=v}
  w.init=s;w.frac=0;w.lastDing=0;w.done=false;w.dirty=true;makeShade(w);
}

// ---------------- 게임 흐름 ----------------
const G={on:false,t:0,stage:0,stars:0,phase:'menu',msg:null,msgT:0};
function activeWalls(){return CFG.mode==='vs'?['left','right']:WALLS}
function tool(){return CFG.mode==='vs'?TOOLS[1]:TOOLS[G.stage]}
function startGame(){
  ac();sfx.click();$('#menu').classList.remove('on');$('#homeBtn').classList.add('on');
  G.on=true;G.stage=0;G.stars=0;G.t0=G.t;G.order=shuffle([0,1,2,3,4,5]);G.winner=null;
  setupStage();
}
function setupStage(){
  G.phase='play';
  const act=activeWalls();
  WALLS.forEach((k,i)=>{const w=WL[k];w.active=act.includes(k);w.mons=[];w.robot=null;w.parts=[];w.monT=G.t+4;
    w.team=CFG.mode==='vs'?(k==='left'?0:1):null;
    w.scene=CFG.mode==='vs'?G.order[0]:G.order[(G.stage*3+i)%6];
    if(G.stage===2)w.scene=G.order[(i*2+1)%6];
    if(w.active){fillDust(w);if(G.stage===2&&CFG.mode==='coop')w.robot={x:LW/2,y:DH/2,vx:14,vy:9}}
    else{w.dust.fill(0);w.done=true;w.frac=1;w.dirty=true}
  });
  if(CFG.mode==='vs')WL.left.scene=WL.right.scene=G.order[0];
  const tl=tool();
  const say=CFG.mode==='vs'?'빗자루로 누가 먼저 닦나! 왼쪽 팀, 오른쪽 팀, 시작!':
    ['달이 먼지투성이! 칫솔로 싹싹 닦아요!','빗자루가 생겼어요! 먼지 괴물도 콕콕 잡아요!','청소기랑 로봇 친구가 왔어요! 마지막 청소!'][G.stage];
  banner(CFG.mode==='vs'?'⚔️ 대결!':`${G.stage+1}단계 · ${tl.name}`,say);speak(say);
}
function banner(title,sub){G.msg={title,sub};G.msgT=G.t}
function wallDone(w){
  w.done=true;w.doneT=G.t;sfx.wall();
  const nm=SCENES[w.scene].name;
  if(CFG.mode==='vs'){if(G.winner==null){G.winner=w.team;G.phase='end';G.endT=G.t;banner(`${w.team?'오른쪽':'왼쪽'} 팀 승리! 🏆`,nm+' 완성!');speak(`${w.team?'오른쪽':'왼쪽'} 팀 승리! ${nm} 완성!`)}return}
  speak(nm+' 나왔다!');
  if(activeWalls().every(k=>WL[k].done)){
    G.phase='stageclear';G.clearT=G.t;sfx.stage();
    if(G.stage<2){const nx=TOOLS[G.stage+1].name;banner(`${G.stage+1}단계 깨끗! ✨`,`새 도구: ${nx}!`);setTimeout(()=>speak(`${G.stage+1}단계 깨끗! 새 도구, ${nx}!`),1600)}
    else{G.phase='end';G.endT=G.t;const s=Math.round(G.t-G.t0);banner('달이 반짝반짝! 🌕',`${Math.floor(s/60)}분 ${s%60}초 · 먼지 괴물 ⭐${G.stars}`);setTimeout(()=>speak('달 청소 끝! 달이 반짝반짝해요!'),1600)}
  }
}
function goHome(){G.on=false;G.phase='menu';$('#menu').classList.add('on');$('#homeBtn').classList.remove('on');if(scrubG)scrubG.gain.value=0;try{speechSynthesis.cancel()}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------------- 문지르기 ----------------
function rub(w,lx,ly,r,pow,byHand){
  if(w.done)return 0;
  let got=0;const x0=Math.max(0,Math.floor(lx-r)),x1=Math.min(LW-1,Math.ceil(lx+r)),y0=Math.max(0,Math.floor(ly-r)),y1=Math.min(DH-1,Math.ceil(ly+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=Math.hypot(x-lx,y-ly);if(d>r)continue;const i=y*LW+x,v=w.dust[i];if(v<=0)continue;
    const nv=Math.max(0,v-pow*(1-.45*d/r));got+=v-nv;w.dust[i]=nv}
  if(got>0){w.dirty=true;if(byHand){scrubAct=Math.min(1,scrubAct+got*.04);
    for(let k=0;k<Math.min(6,got*1.5);k++){const a=Math.random()*6.283,s=10+Math.random()*25;w.parts.push({x:lx+(Math.random()-.5)*r,y:ly+(Math.random()-.5)*r,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8,l:.5+Math.random()*.4,t:0,c:'#b9b7c8'})}}}
  return got;
}
function wallAt(x,y){for(const k of WALLS){const r=RECT[k];if(r&&x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)return[WL[k],r]}return[null,null]}
function onTouch(id,x,y){
  if(!G.on||G.phase!=='play')return;
  const [w,r]=wallAt(x,y);if(!w||!w.active)return;
  const lx=(x-r.x)/r.w*LW,ly=(y-r.y)/r.h*LH;
  w.cursors.set(id,{x:lx,y:ly,t:G.t});
  if(ly>DH+2)return;
  const tl=tool();
  // 먼지 괴물 콕
  for(const m of w.mons){if(m.pop)continue;if(Math.hypot(lx-(m.x+4),ly-(m.y+4))<tl.r+3&&G.t-m.hitT>.22){m.hitT=G.t;m.hp--;sfx.hit();
    if(m.hp<=0){m.pop=G.t;G.stars++;sfx.pop();for(let k=0;k<16;k++){const a=k/16*6.283;w.parts.push({x:m.x+4,y:m.y+4,vx:Math.cos(a)*30,vy:Math.sin(a)*30,l:.7,t:0,c:k%2?'#ffe066':'#ffffff'})}}}}
  rub(w,lx,ly,tl.r,.55,true);
}
const down=new Set();
cv.addEventListener('pointerdown',e=>{ac();down.add(e.pointerId);onTouch(e.pointerId,e.clientX,e.clientY)});
addEventListener('pointermove',e=>{if(down.has(e.pointerId))onTouch(e.pointerId,e.clientX,e.clientY)});
const up=e=>down.delete(e.pointerId);addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});
document.addEventListener('contextmenu',e=>e.preventDefault());

// ---------------- 갱신 ----------------
function update(dt){
  if(scrubG){scrubG.gain.value=scrubG.gain.value*.8+Math.min(.22,scrubAct*.3)*.2}
  scrubAct*=Math.pow(.02,dt);
  if(!G.on)return;
  if(G.phase==='stageclear'&&G.t-G.clearT>6){G.stage++;setupStage()}
  for(const k of WALLS){const w=WL[k];if(!w.active)continue;
    // 진행률
    if(w.dirty&&!w.done){let s=0;for(let i=0;i<w.dust.length;i++)s+=w.dust[i];w.frac=1-s/w.init;
      if(w.frac-w.lastDing>.1){w.lastDing=Math.floor(w.frac*10)/10;sfx.ding()}
      if(w.frac>=.9&&G.phase==='play')wallDone(w)}
    if(w.done&&w.frac<1){let any=0;for(let i=0;i<w.dust.length;i++){if(w.dust[i]>0){w.dust[i]=Math.max(0,w.dust[i]-dt*1.2*(1+Math.random()));any=1}}w.dirty=true;if(!any)w.frac=1;
      if(Math.random()<.5)w.parts.push({x:Math.random()*LW,y:Math.random()*DH,vx:0,vy:-6,l:.6,t:0,c:'#ffffff'})}
    // 먼지 괴물 (2단계부터)
    const monOn=(CFG.mode==='vs'||G.stage>=1)&&!w.done&&G.phase==='play';
    if(monOn&&w.mons.filter(m=>!m.pop).length<2&&G.t>w.monT){w.monT=G.t+5+Math.random()*4;
      w.mons.push({x:10+Math.random()*(LW-30),y:5+Math.random()*(DH-20),vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*14,hp:3,hitT:0,pop:0,dirtT:0})}
    for(let i=w.mons.length-1;i>=0;i--){const m=w.mons[i];
      if(m.pop){if(G.t-m.pop>.4)w.mons.splice(i,1);continue}
      if(w.done){m.pop=G.t;continue}
      m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<2||m.x>LW-11)m.vx*=-1;if(m.y<2||m.y>DH-10)m.vy*=-1;
      if(Math.random()<dt*.6){m.vx=(Math.random()-.5)*24;m.vy=(Math.random()-.5)*16}
      if(G.t-m.dirtT>.35){m.dirtT=G.t;const t=THICK[CFG.lv]*.5;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=Math.round(m.x+4+dx-m.vx*.15),y=Math.round(m.y+7+dy);if(x<0||y<0||x>=LW||y>=DH)continue;const j=y*LW+x;w.dust[j]=Math.max(w.dust[j],t*(.5+Math.random()*.5))}w.dirty=true}
    }
    // 로봇 도우미 (3단계): 벽 가운데 띠를 돌며 청소
    if(w.robot&&!w.done){const b=w.robot;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<LW*.34||b.x>LW*.66-10)b.vx*=-1;if(b.y<2||b.y>DH-8)b.vy*=-1;rub(w,b.x+5,b.y+3,4.5,dt*1.4,false)}
    for(let i=w.parts.length-1;i>=0;i--){const p=w.parts[i];p.t+=dt;if(p.t>p.l){w.parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt}
    for(const [id,c] of w.cursors)if(G.t-c.t>.5)w.cursors.delete(id);
  }
}

// ---------------- 그리기 ----------------
function drawWall(k){
  const w=WL[k],r=RECT[k];if(!r)return;
  g=w.cg;g.imageSmoothingEnabled=false;
  // 하늘
  const sky=['#0b0b2b','#101040','#151552'];for(let i=0;i<3;i++)R(0,i*DH/3,LW,DH/3+1,sky[i]);
  for(const [x,y,p] of w.stars){const tw=(Math.sin(G.t*2+p*20)+1)/2;R(x,y,1,1,tw>.7?'#ffffff':tw>.3?'#9fa8da':'#3949ab')}
  if(k==='front'){C(140,14,9,'#1e88e5');R(134,10,6,4,'#43a047');R(141,15,5,5,'#43a047');R(136,18,3,2,'#43a047')}
  ground();
  const a=w.done?(G.t-w.doneT)*1.2:0;
  if(!(G.on&&CFG.mode==='vs'&&k==='front'))SCENES[w.scene].draw(G.t,a);
  else{ // 대결 때 정면: 두 팀 진행 막대(도트)
    const L=WL.left.frac,Rr=WL.right.frac;
    R(20,26,120,10,'#2b2b6b');R(20,26,120*Math.min(1,L/.9),10,'#ff5a5f');
    R(20,46,120,10,'#2b2b6b');R(20,46,120*Math.min(1,Rr/.9),10,'#3fa9ff');
  }
  // 먼지
  if(w.active&&w.frac<1){
    if(w.dirty||!w.img){if(!w.img)w.img=w.dg.createImageData(LW,DH);const d=w.img.data;
      for(let i=0;i<LW*DH;i++){const v=w.dust[i],o=i*4;if(v<=.04){d[o+3]=0;continue}
        const c=DUSTC[w.shade[i]];d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=v>.6?255:v>.3?200:v>.12?110:60}
      w.dg.putImageData(w.img,0,0);w.dirty=false}
    g.drawImage(w.dc,0,0);
  }
  // 로봇, 괴물
  if(w.robot&&!w.done){SP(ROBOT.map,ROBOT.pal,w.robot.x,w.robot.y);if(Math.floor(G.t*6)%2)R(w.robot.x+4,w.robot.y-2,2,1,'#00e5ff')}
  for(const m of w.mons){if(m.pop){const k2=(G.t-m.pop)/.4;R(m.x+4-k2*6,m.y+4-k2*6,2,2,'#ffe066');R(m.x+4+k2*6,m.y+4-k2*6,2,2,'#ffe066');continue}
    const sh=G.t-m.hitT<.15?(Math.random()-.5)*2:0;SP(MONSTER.map,MONSTER.pal,m.x+sh,m.y+Math.round(Math.sin(G.t*6+m.x)*.6),m.vx<0);
    for(let i=0;i<m.hp;i++)R(m.x+1+i*3,m.y-3,2,1,'#ff5252')}
  for(const p of w.parts)R(p.x,p.y,1,1,p.c);
  // 도구 (손 위치)
  const tl=tool();
  if(G.on)for(const c of w.cursors.values()){const wig=Math.round(Math.sin(G.t*30));SP(tl.map,tl.pal,c.x-tl.map[0].length/2+wig,c.y-tl.map.length/2)}
  // 크게 그리기
  ctx.imageSmoothingEnabled=false;ctx.drawImage(w.comp,0,0,LW,LH,r.x,r.y,r.w,r.h);
  // 아래 띠: 진행률 (큰 글씨)
  if(G.on&&w.active){
    const by=r.y+r.h*(DH+4)/LH,bh=r.h*.07,bx=r.x+r.w*.08,bw=r.w*.84;
    ctx.fillStyle='#000a';ctx.fillRect(bx-6,by-6,bw+12,bh+12);ctx.fillStyle='#2b2b6b';ctx.fillRect(bx,by,bw,bh);
    const f=Math.max(0,Math.min(1,w.frac/.9));ctx.fillStyle=w.team===0?'#ff5a5f':w.team===1?'#3fa9ff':'#ffe066';
    for(let i=0;i<20;i++)if(i<Math.floor(f*20))ctx.fillRect(bx+i*bw/20+2,by+2,bw/20-4,bh-4);
    txt(w.done?`✨ ${SCENES[w.scene].name} ✨`:`${Math.floor(f*100)}%`,bx+bw/2,by+bh/2,bh*.62,'#fff');
    if(w.team!=null)txt(w.team?'오른쪽 팀':'왼쪽 팀',bx,by-bh*.6,bh*.5,w.team?'#3fa9ff':'#ff5a5f','left');
  }
}
function txt(s,x,y,size,col='#fff',al='center'){ctx.font=`${size}px ${FONT}`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(s,x+size*.08,y+size*.08);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function drawBanner(){
  if(!G.msg)return;const el=G.t-G.msgT,end=G.phase==='end';if(!end&&el>3.2)return;
  const f=RECT.front,a=end?1:Math.min(1,el*4,(3.2-el)*3);ctx.globalAlpha=Math.max(0,a);
  const w=f.w*.7,h=f.h*.3,x=f.x+(f.w-w)/2,y=f.y+f.h*.22;
  ctx.fillStyle='#000';ctx.fillRect(x+12,y+12,w,h);ctx.fillStyle='#ffe066';ctx.fillRect(x,y,w,h);ctx.fillStyle='#2b2b6b';ctx.fillRect(x+8,y+8,w-16,h-16);
  txt(G.msg.title,x+w/2,y+h*.38,h*.24,'#ffe066');txt(G.msg.sub,x+w/2,y+h*.72,h*.13,'#fff');
  if(end&&G.t-G.endT>3){txt('🏠 를 누르면 처음으로',x+w/2,y+h+f.h*.06,h*.1,'#cfd6ff')}
  ctx.globalAlpha=1;
}
function resize(){
  W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;RECT=computeRects();
  const f=RECT.front,m=$('#menu');Object.assign(m.style,{left:f.x+'px',top:f.y+'px',width:f.w+'px',height:f.h+'px'});
  const hb=$('#homeBtn');hb.style.left=(f.x+f.w/2-(hb.offsetWidth||70)/2)+'px';hb.style.top=(f.y+f.h*.9)+'px';
}
addEventListener('resize',resize);
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G.t+=dt;
  update(dt);
  ctx.fillStyle='#0b0b1e';ctx.fillRect(0,0,W,H);
  if(G.on){for(const k of WALLS)drawWall(k);drawBanner()}
  else for(const k of ['left','right']){const w=WL[k];w.active=false;w.frac=1;w.done=false;w.mons=[];w.robot=null;w.scene=k==='left'?0:2;drawWall(k)}
  requestAnimationFrame(loop);
}

// ---------------- 메뉴 ----------------
function syncOpts(){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',String(CFG[b.dataset.k])===b.dataset.v))}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k,v=b.dataset.v;CFG[k]=/^\d+$/.test(v)?+v:v;save(k,CFG[k]);sfx.click();syncOpts()}));
$('#startBtn').addEventListener('click',startGame);
$('#homeBtn').addEventListener('click',goHome);
(function(){const m=/walls=([-\d,;]+)/.exec(decodeURIComponent(location.hash||''));if(!m)return;
  const p=m[1].split(';').map(t=>t.split(',').map(Number));if(p.length!==3||p.some(a=>a.length!==4||a.some(isNaN)))return;
  const w={};WALLS.forEach((k,i)=>w[k]={x:p[i][0],y:p[i][1],w:p[i][2],h:p[i][3]});save('walls',w)})();
syncOpts();$('#menu').classList.add('on');resize();requestAnimationFrame(loop);
window.__moon={G,CFG,WL,RECT:()=>RECT,startGame,goHome,onTouch,LW,LH,DH};
</script>
